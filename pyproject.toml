[project]
name = "cc-runtime"
version = "0.1.0"
description = "Containerized development machines that share a Mac workspace"
readme = "README.md"
authors = [
    { name = "zeke-chin", email = "zeke.chin@outlook.com" }
]
requires-python = ">=3.9"
dependencies = [
    "rich>=13",
]

[project.scripts]
cc-runtime = "cc_runtime:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
