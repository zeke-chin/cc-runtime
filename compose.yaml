services:
  dev:
    image: ghcr.io/zeke-chin/cc-runtime:latest
    entrypoint: [/bin/bash, /usr/local/bin/entrypoint.sh]
    restart: unless-stopped
    cap_drop: [NET_RAW]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
      TZ: America/New_York
    volumes:
      - type: bind
        source: ./dev-runtime/ssh-host-keys
        target: /var/lib/cc-runtime/ssh
        bind:
          create_host_path: false
      # Per-machine identity instead of the machine-id once baked into the image.
      - type: bind
        source: ./dev-runtime/machine-id
        target: /etc/machine-id
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./dev-runtime/machine-id
        target: /var/lib/dbus/machine-id
        read_only: true
        bind:
          create_host_path: false
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - type: bind
        source: ./dev-runtime/home
        target: /home/dev
        bind:
          create_host_path: false
      - type: bind
        source: /Users/zeke/workspace
        target: /home/dev/workspace
        bind:
          create_host_path: false
      - type: bind
        source: /Users/zeke/Downloads
        target: /home/dev/Downloads
        bind:
          create_host_path: false
      - ./proxy/resolv.conf:/etc/resolv.conf:ro
    networks:
      private:
        ipv4_address: 172.30.0.10

  # Second development machine; egress via proxy-california (California node).
  # Distinct identity: own home, SSH host keys, machine-id and hostname.
  # The hostname keeps the machine's original name.
  dev-CA:
    image: ghcr.io/zeke-chin/cc-runtime:latest
    hostname: dev-california
    entrypoint: [/bin/bash, /usr/local/bin/entrypoint.sh]
    restart: unless-stopped
    cap_drop: [NET_RAW]
    sysctls:
      net.ipv6.conf.all.disable_ipv6: "1"
    depends_on:
      proxy-california:
        condition: service_healthy
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
      TZ: America/Los_Angeles
      PYTHONPYCACHEPREFIX: /home/dev/.cache/python/pycache
      XDG_CACHE_HOME: /home/dev/.cache
    volumes:
      - type: bind
        source: ./dev-runtimes/dev-CA/ssh-host-keys
        target: /var/lib/cc-runtime/ssh
        bind:
          create_host_path: false
      - type: bind
        source: ./dev-runtimes/dev-CA/machine-id
        target: /etc/machine-id
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./dev-runtimes/dev-CA/machine-id
        target: /var/lib/dbus/machine-id
        read_only: true
        bind:
          create_host_path: false
      - ./entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - type: bind
        source: ./dev-runtimes/dev-CA/home
        target: /home/dev
        bind:
          create_host_path: false
      # Linux mirror of the Mac workspace, kept in sync by Mutagen on the Mac
      # (scripts/workspace-sync.py). Dependencies installed here stay Linux-only.
      - type: bind
        source: /Users/zeke/.cc-runtime/linux-workspace
        target: /home/dev/workspace
        bind:
          create_host_path: false
      # Shared git data; .git symlinks in both trees point here (scripts/git-store.py).
      - type: bind
        source: /Users/zeke/.cc-runtime/git
        target: /Users/zeke/.cc-runtime/git
        bind:
          create_host_path: false
      # Static cache declaration: dev-CA is not part of the dependency scan.
      # The subpath is the one it used as dev-california (aarch64, workspace hash).
      - type: volume
        source: dependencies
        target: /home/dev/.cache
        volume:
          nocopy: true
          subpath: linux-aarch64/b7bcf81f26a3f3a5/cache-dev-california
      - type: bind
        source: /Users/zeke/Downloads
        target: /home/dev/Downloads
        bind:
          create_host_path: false
      - ./proxy/resolv-california.conf:/etc/resolv.conf:ro
    networks:
      private:
        ipv4_address: 172.30.0.11

  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-cc-dev}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      # Allow time for the first interactive browser login (default is only 60s).
      TS_BOOT_TIMEOUT: 30m
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - type: bind
        source: ./tailscale/state
        target: /var/lib/tailscale
        bind:
          create_host_path: false
      - ./tailscale/config:/config:ro
    networks:
      private:
        ipv4_address: 172.30.0.3
      outbound: {}

  proxy:
    image: metacubex/mihomo:latest
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    entrypoint: [/bin/sh, /scripts/proxy-entrypoint.sh]
    volumes:
      - ./scripts/proxy-entrypoint.sh:/scripts/proxy-entrypoint.sh:ro
      - type: bind
        source: ./proxy/config.yaml
        target: /root/.config/mihomo/config.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      private:
        ipv4_address: 172.30.0.2
      outbound: {}
    ports:
      - "127.0.0.1:19090:9090"
      - "127.0.0.1:2222:10022"
      - "127.0.0.1:5901:15901"
      - "127.0.0.1:6080:16080"
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 9090 && nc -z 127.0.0.1 53"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Second gateway whose final egress is the California node.
  # Serves dev-CA (CLIENT_IP).
  proxy-california:
    image: metacubex/mihomo:latest
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
      GATEWAY_IP: 172.30.0.4
      CLIENT_IP: 172.30.0.11
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    entrypoint: [/bin/sh, /scripts/proxy-entrypoint.sh]
    volumes:
      - ./scripts/proxy-entrypoint.sh:/scripts/proxy-entrypoint.sh:ro
      - type: bind
        source: ./proxy/config-california.yaml
        target: /root/.config/mihomo/config.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      private:
        ipv4_address: 172.30.0.4
      outbound: {}
    ports:
      - "127.0.0.1:19091:9090"
      - "127.0.0.1:17890:7890"
      # dev-CA SSH / VNC / noVNC via fixed DIRECT tunnels.
      - "127.0.0.1:2223:10022"
      - "127.0.0.1:5902:15901"
      - "127.0.0.1:6081:16080"
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 9090 && nc -z 127.0.0.1 53"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Only this short-lived helper shares dev's network namespace.
  # It never receives the proxy config or credentials.
  dev-network-init:
    image: metacubex/mihomo:latest
    network_mode: service:dev
    restart: "no"
    cap_add: [NET_ADMIN]
    depends_on:
      dev:
        condition: service_started
    entrypoint: [/bin/sh, /scripts/dev-network-init.sh]
    volumes:
      - ./scripts/dev-network-init.sh:/scripts/dev-network-init.sh:ro

  dev-CA-network-init:
    image: metacubex/mihomo:latest
    network_mode: service:dev-CA
    restart: "no"
    cap_add: [NET_ADMIN]
    environment:
      GATEWAY_IP: 172.30.0.4
    depends_on:
      dev-CA:
        condition: service_started
    entrypoint: [/bin/sh, /scripts/dev-network-init.sh]
    volumes:
      - ./scripts/dev-network-init.sh:/scripts/dev-network-init.sh:ro

volumes:
  dependencies:
    external: true
    name: cc-runtime_dependencies

networks:
  private:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.0.0/24
  outbound:
    enable_ipv6: false

