# Paths come from .env (see .env.example). Compose does not expand "~": use absolute paths.
x-dev-machine: &dev-machine
  image: ${DEV_IMAGE:-ghcr.io/zeke-chin/cc-runtime:latest}
  entrypoint: [/bin/bash, /usr/local/bin/entrypoint.sh]
  restart: unless-stopped
  cap_drop: [NET_RAW]
  sysctls:
    net.ipv6.conf.all.disable_ipv6: "1"

x-bind: &bind
  type: bind
  bind:
    create_host_path: false

services:
  # Development machine dev-PA; egress via the main gateway (proxy).
  # Each machine has its own home, SSH host keys and machine-id under
  # dev-runtimes/<name>/. All machines share the Linux mirror of the workspace
  # and the git store (see docs/architecture.md).
  dev-PA:
    <<: *dev-machine
    depends_on:
      proxy:
        condition: service_healthy
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
      TZ: America/New_York
      PYTHONPYCACHEPREFIX: /home/dev/.cache/python/pycache
      XDG_CACHE_HOME: /home/dev/.cache
    volumes:
      - {<<: *bind, source: ./dev-runtimes/dev-PA/ssh-host-keys, target: /var/lib/cc-runtime/ssh}
      - {<<: *bind, source: ./dev-runtimes/dev-PA/machine-id, target: /etc/machine-id, read_only: true}
      - {<<: *bind, source: ./dev-runtimes/dev-PA/machine-id, target: /var/lib/dbus/machine-id, read_only: true}
      - {<<: *bind, source: ./dev-runtimes/dev-PA/home, target: /home/dev}
      - {<<: *bind, source: "${RUNTIME_DIR:?Set RUNTIME_DIR in .env}/linux-workspace", target: /home/dev/workspace}
      - {<<: *bind, source: "${RUNTIME_DIR}/git", target: "${RUNTIME_DIR}/git"}
      - {<<: *bind, source: "${DOWNLOADS_DIR:?Set DOWNLOADS_DIR in .env}", target: /home/dev/Downloads}
      - type: volume
        source: cache
        target: /home/dev/.cache
        volume: {nocopy: true, subpath: "${DEV_PA_CACHE:-dev-PA}"}
      - ./scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./proxy/resolv.conf:/etc/resolv.conf:ro
    networks:
      private:
        ipv4_address: 172.30.0.10

  # Development machine dev-CA; egress via proxy-california (California node).
  # Its hostname keeps the machine's original name.
  dev-CA:
    <<: *dev-machine
    hostname: dev-california
    depends_on:
      proxy-california:
        condition: service_healthy
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
      TZ: America/Los_Angeles
      PYTHONPYCACHEPREFIX: /home/dev/.cache/python/pycache
      XDG_CACHE_HOME: /home/dev/.cache
    volumes:
      - {<<: *bind, source: ./dev-runtimes/dev-CA/ssh-host-keys, target: /var/lib/cc-runtime/ssh}
      - {<<: *bind, source: ./dev-runtimes/dev-CA/machine-id, target: /etc/machine-id, read_only: true}
      - {<<: *bind, source: ./dev-runtimes/dev-CA/machine-id, target: /var/lib/dbus/machine-id, read_only: true}
      - {<<: *bind, source: ./dev-runtimes/dev-CA/home, target: /home/dev}
      - {<<: *bind, source: "${RUNTIME_DIR:?Set RUNTIME_DIR in .env}/linux-workspace", target: /home/dev/workspace}
      - {<<: *bind, source: "${RUNTIME_DIR}/git", target: "${RUNTIME_DIR}/git"}
      - {<<: *bind, source: "${DOWNLOADS_DIR:?Set DOWNLOADS_DIR in .env}", target: /home/dev/Downloads}
      - type: volume
        source: cache
        target: /home/dev/.cache
        volume: {nocopy: true, subpath: "${DEV_CA_CACHE:-dev-CA}"}
      - ./scripts/entrypoint.sh:/usr/local/bin/entrypoint.sh:ro
      - ./proxy/resolv-california.conf:/etc/resolv.conf:ro
    networks:
      private:
        ipv4_address: 172.30.0.11

  tailscale:
    image: tailscale/tailscale:stable
    restart: unless-stopped
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-cc-dev}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      # Allow time for the first interactive browser login (default is only 60s).
      TS_BOOT_TIMEOUT: 30m
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - type: bind
        source: ./tailscale/state
        target: /var/lib/tailscale
        bind:
          create_host_path: false
      - ./tailscale/config:/config:ro
    networks:
      private:
        ipv4_address: 172.30.0.3
      outbound: {}

  proxy:
    image: metacubex/mihomo:latest
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    entrypoint: [/bin/sh, /scripts/proxy-entrypoint.sh]
    volumes:
      - ./scripts/proxy-entrypoint.sh:/scripts/proxy-entrypoint.sh:ro
      - type: bind
        source: ./proxy/config.yaml
        target: /root/.config/mihomo/config.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      private:
        ipv4_address: 172.30.0.2
      outbound: {}
    ports:
      - "127.0.0.1:19090:9090"
      - "127.0.0.1:2222:10022"
      - "127.0.0.1:5901:15901"
      - "127.0.0.1:6080:16080"
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 9090 && nc -z 127.0.0.1 53"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Second gateway whose final egress is the California node.
  # Serves dev-CA (CLIENT_IP).
  proxy-california:
    image: metacubex/mihomo:latest
    environment:
      PASSWORD: ${PASSWORD:?Set PASSWORD in .env}
      GATEWAY_IP: 172.30.0.4
      CLIENT_IP: 172.30.0.11
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.disable_ipv6: "1"
    entrypoint: [/bin/sh, /scripts/proxy-entrypoint.sh]
    volumes:
      - ./scripts/proxy-entrypoint.sh:/scripts/proxy-entrypoint.sh:ro
      - type: bind
        source: ./proxy/config-california.yaml
        target: /root/.config/mihomo/config.yaml
        read_only: true
        bind:
          create_host_path: false
    networks:
      private:
        ipv4_address: 172.30.0.4
      outbound: {}
    ports:
      - "127.0.0.1:19091:9090"
      - "127.0.0.1:17890:7890"
      # dev-CA SSH / VNC / noVNC via fixed DIRECT tunnels.
      - "127.0.0.1:2223:10022"
      - "127.0.0.1:5902:15901"
      - "127.0.0.1:6081:16080"
    healthcheck:
      test: [CMD-SHELL, "nc -z 127.0.0.1 9090 && nc -z 127.0.0.1 53"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Short-lived helpers that share a machine's network namespace to route it
  # through its gateway. They never receive the proxy config or credentials.
  dev-PA-network-init:
    image: metacubex/mihomo:latest
    network_mode: service:dev-PA
    restart: "no"
    cap_add: [NET_ADMIN]
    depends_on:
      dev-PA:
        condition: service_started
    entrypoint: [/bin/sh, /scripts/dev-network-init.sh]
    volumes:
      - ./scripts/dev-network-init.sh:/scripts/dev-network-init.sh:ro

  dev-CA-network-init:
    image: metacubex/mihomo:latest
    network_mode: service:dev-CA
    restart: "no"
    cap_add: [NET_ADMIN]
    environment:
      GATEWAY_IP: 172.30.0.4
    depends_on:
      dev-CA:
        condition: service_started
    entrypoint: [/bin/sh, /scripts/dev-network-init.sh]
    volumes:
      - ./scripts/dev-network-init.sh:/scripts/dev-network-init.sh:ro

volumes:
  # Per-machine ~/.cache (subpaths in .env). External, so `down -v` keeps it.
  cache:
    external: true
    name: ${CACHE_VOLUME:-cc-runtime-cache}

networks:
  private:
    internal: true
    enable_ipv6: false
    ipam:
      config:
        - subnet: 172.30.0.0/24
  outbound:
    enable_ipv6: false

